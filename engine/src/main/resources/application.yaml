server:
  port: 10020


spring:
  application:
    name: myonecoupon-engine
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-config.yaml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 145690

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  default-flat-param-object: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: org.sylvester.engine

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    # Redisson 检测到 Netty 低于 4.1.105 会提示 DNS TCP fallback 不可用；
    # 该能力仅在 UDP DNS 查询超时时才启用，直连 Redis IP 场景无影响，此处仅降噪
    org.redisson.connection.SequentialDnsAddressResolverFactory: error
