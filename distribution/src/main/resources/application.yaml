server:
  port: 10040


spring:
  application:
    name: myonecoupon-distribution
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-config.yaml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 145690

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: myoneCoupon_distribution${unique-name:}-service_common-message-execute_pg
    send-message-timeout: 2000
    retry-times-when-send-failed: 1
    retry-times-when-send-async-failed: 1

logging:
  level:
    # Redisson 检测到 Netty 低于 4.1.105 会提示 DNS TCP fallback 不可用；
    # 该能力仅在 UDP DNS 查询超时时才启用，直连 Redis IP 场景无影响，此处仅降噪
    org.redisson.connection.SequentialDnsAddressResolverFactory: error
